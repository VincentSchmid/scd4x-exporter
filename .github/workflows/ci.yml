name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image version
        id: version
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^v[0-9][A-Za-z0-9_.-]{0,126}$ ]]; then
              echo 'Release tag must be a valid Docker tag (for example, v0.2.0).' >&2
              exit 1
            fi
          fi
          printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/vincentschmid/scd4x-exporter:${{ steps.version.outputs.tag }}
            ghcr.io/vincentschmid/scd4x-exporter:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
      - name: Report image pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: printf '`ghcr.io/vincentschmid/scd4x-exporter:%s@%s`\n' "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
